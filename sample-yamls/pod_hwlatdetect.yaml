apiVersion: v1 
kind: Pod 
metadata:
  name: hwlatdetect 
  annotations:
    cpu-load-balancing.crio.io: "disable"
    irq-load-balancing.crio.io: "disable"
    cpu-quota.crio.io: "disable"
spec:
  # Map to the correct performance class in the cluster (from PAO)
  # Identify class names with "oc get runtimeclass"
  runtimeClassName: performance-openshift-node-performance-profile
  restartPolicy: Never
  containers:
  - name: hwlatdetect 
    image: quay.io/container-perf-tools/hwlatdetect
    imagePullPolicy: Always 
    # Guaranteed CPU allocation gives hwlatdetect an isolated pod CPU set
    resources:
      requests:
        memory: "200Mi"
        cpu: "16"
      limits:
        memory: "200Mi"
        cpu: "16"
    env:
    - name: tool
      value: "hwlatdetect"
    - name: RUNTIME_SECONDS 
      value: "30"
    - name: THRESHOLD
      value: "10"
    - name: EXTRA_ARGS
      value: ""
    - name: ALL_CPUS
      value: "n"
    securityContext:
      # Required for access to /dev/cpu_dma_latency and /sys/kernel/debug on the host
      privileged: true
  nodeSelector:
    node-role.kubernetes.io/worker: ""
